
{{##def.page_title = 'WoWgo Ethereum Game' #}}

{{##def.content:

    <div class="index">


        <div class="grid">
            <div class="col-1-1">
                <h1 class="title">WoWgo Ethereum Game</h1>
            </div>

            <div class="play-btn-col col-1-1">
                <div class="play-btn-cont">
                    <a href="#login" class="play">
                        Play
                    </a>
                    
                </div>
                <div class="bg-overlay" id="login">
                <div class="subscribe-optin">
                    <div class="login-form">
                        <form action="/login" method="post" onsubmit="return submitEnabled;">
                            <div class="row">
                                <div class="large-12 columns">
                                    <label>Username
                                        <input type="text" name="username" required/>
                                    </label>
                                </div>
                            </div>
                             <div class="row">
                                <div class="large-12 columns">
                                    <label>Password
                                        <input type="password" name="password" required />
                                    </label>
                                </div>
                             </div>
                            <div class="row">
                                <div class="large-12 columns">
                                    <label>
                                        Remember me
                                        <input type="checkbox" name="remember">
                                    </label>
                                </div>
                            </div>
                             <!--<div class="row">
                                <div class="g-recaptcha" data-sitekey="{{=it.recaptchaKey}}" data-callback="enableSubmit"></div>
                             </div>-->
                             <div class="row">
                                <div class="large-12 columns">
                                    <a class="small" href="#forgot-password">Forgot your password?</a><br>
                                    <input id="loginSubmit"  class="border-button right blue" value="Login" type="submit" />
                                </div>

                            </div>

                        </form>
                    </div>
                    <a href="#" class="optin-close">&times;</a>
                </div>
            </div><!-- login popup -->
            <div class="bg-overlay" id="forgot-password">
                <div class="subscribe-optin">
                    <form action="/sent-recover" method="post" onsubmit="return submitEnabled;">
                        <div class="row">
                            <div class="large-6 large-offset-2 columns">
                                <label>Enter your email
                                    <input type="email" name="email" required/>
                                </label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="g-recaptcha" data-sitekey="{{=it.recaptchaKey}}" data-callback="enableSubmit"></div>
                        </div>
                        <div class="row">
                            <div class="large-12 columns">
                                <input  id="forgotSubmit" class="border-button right blue" type="submit" value="Submit"/>
                            </div>
                        </div>
                    </form>
                    <a href="#" class="optin-close">&times;</a>
                </div>
            </div><!-- forget pwd popup -->
            </div>
        </div>

        <div class="features grid">

            <div class="feature col-4-12">
                <div>
                    <img src="img/icons/dice.png" alt=""/>
                </div>
                <h4>Working Randomly</h4>

            </div>
            <div class="feature col-4-12">

                </div>
                <h4>Graph Game</h4>

            <div class="feature col-4-12">
